name: Tests

on:
  pull_request:
    branches: [ main, dev ]
    paths: 
      - "cmd/**"
      - "internal/**"
      - main.go
      - go.mod
      - go.sum

permissions:
  contents: read
  code-quality: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.xml ./...
        env:
          CGO_ENABLED: 0

      - name: Upload coverage
        uses: actions/upload-code-coverage@v1.3.0
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go